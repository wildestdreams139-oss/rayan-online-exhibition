name: Audit RAYAN V7.1 assets

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect deploy payload and every referenced asset
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _audit
          mkdir -p _audit
          unzip -q -o RAYAN_site_payload.zip -d _audit
          if [ -d v6-overlay ]; then rsync -a v6-overlay/ _audit/; fi
          mkdir -p _audit/assets
          rsync -a assets/ _audit/assets/

          if [ -f .site-assets/stars-v71.zip.b64 ]; then
            mkdir -p _audit/assets/images/curated
            base64 -d .site-assets/stars-v71.zip.b64 > /tmp/stars-v71.zip
            unzip -q -o /tmp/stars-v71.zip -d _audit/assets/images/curated
          fi

          cp index.html _audit/index.html
          cp archive.html _audit/archive.html
          cp invitation.html _audit/invitation.html
          cp opening-night.html _audit/opening-night.html

          echo "=== every local asset referenced by HTML ==="
          missing=0
          for page in _audit/index.html _audit/archive.html _audit/invitation.html _audit/opening-night.html; do
            while IFS= read -r asset; do
              [ -z "$asset" ] && continue
              file_asset="${asset%%\?*}"
              if [ -f "_audit/$file_asset" ]; then
                printf 'OK      %s -> %s\n' "$(basename "$page")" "$asset"
              else
                printf 'MISSING %s -> %s\n' "$(basename "$page")" "$asset"
                missing=$((missing+1))
              fi
            done < <(grep -oE '(src|href)="assets/[^"]+"' "$page" | sed -E 's/^(src|href)="([^"]+)"$/\2/' | sort -u)
          done

          echo "=== Photo Salon data ==="
          for f in assets/photo-data-a.js assets/photo-data-b.js assets/photo-data-c.js assets/photo-data-d.js assets/photo-loader.js; do
            if [ -f "_audit/$f" ]; then
              echo "OK $f"
            else
              echo "MISSING $f"
              missing=$((missing+1))
            fi
          done
          photo_refs=$(grep -oE 'data-photo="[Pp][0-9]{2}"' _audit/index.html | sort -u | wc -l || true)
          echo "PHOTO_REFS=$photo_refs"
          [ "$photo_refs" -eq 12 ] || { echo "MISSING Photo Salon references"; missing=$((missing+1)); }

          echo "=== Starlight Chamber ==="
          for f in star-kv.webp star01.webp star02.webp star03.webp star04.webp star05.webp star06.webp star07.webp star08.webp; do
            test -s "_audit/assets/images/curated/$f" || { echo "MISSING $f"; missing=$((missing+1)); }
          done

          echo "=== HTML structure and JS syntax ==="
          node --check _audit/assets/app.js
          node --check _audit/assets/v6.js
          node --check _audit/assets/photo-loader.js

          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import sys

          root=Path('_audit')
          pages=[root/'index.html',root/'archive.html',root/'invitation.html',root/'opening-night.html']
          failures=[]

          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids=[]; self.hashrefs=[]; self.lang_half=[]; self.images=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if 'id' in a:self.ids.append(a['id'])
                  if tag=='a' and a.get('href','').startswith('#'):self.hashrefs.append(a['href'][1:])
                  if ('data-en' in a) ^ ('data-zh' in a):self.lang_half.append((tag,a.get('id',''),a.get('class','')))
                  if tag=='img':self.images.append(a)

          for page in pages:
              p=Audit(); p.feed(page.read_text(encoding='utf-8'))
              ids=set(p.ids)
              dup=sorted({x for x in p.ids if p.ids.count(x)>1})
              if dup: failures.append(f'{page.name}: duplicate ids {dup}')
              missing_hash=sorted({x for x in p.hashrefs if x and x not in ids})
              if missing_hash: failures.append(f'{page.name}: missing hash targets {missing_hash}')
              if p.lang_half: failures.append(f'{page.name}: incomplete data-en/data-zh pairs {p.lang_half[:8]}')
              no_alt=[i.get('src','') for i in p.images if 'alt' not in i]
              if no_alt: failures.append(f'{page.name}: images without alt attribute {no_alt[:8]}')

          src=(root/'index.html').read_text(encoding='utf-8')
          for phrase in [
              'Early drawings, no source photograph.',
              'The physical source photograph is not part of the public hanging.',
              'Here Rayan is not photographed beside a celebrity.',
              'ACCESS GRANTED · UNLISTED ROOM 00'
          ]:
              if phrase in src: failures.append(f'stale copy still present: {phrase}')

          if failures:
              print('\n'.join('FAIL '+x for x in failures))
              sys.exit(1)
          print('HTML structure: OK')
          PY

          echo "MISSING_COUNT=$missing"
          test "$missing" -eq 0

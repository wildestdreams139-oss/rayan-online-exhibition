name: Deploy RAYAN exhibition to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare exhibition
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          if [ -f RAYAN_site_payload.zip ]; then
            unzip -q -o RAYAN_site_payload.zip -d _site
          else
            rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
          fi
          if [ -d v6-overlay ]; then
            rsync -a v6-overlay/ _site/
          fi
          cp index.html _site/index.html
          cp archive.html _site/archive.html
          cp invitation.html _site/invitation.html
          cp opening-night.html _site/opening-night.html
          cp curator_ticket_studio.html _site/curator_ticket_studio.html
          mkdir -p _site/assets
          rsync -a assets/ _site/assets/
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/assets/app.js
          test -f _site/assets/v6.js
          test -f _site/assets/photo-loader.js

          echo "=== V7.1 asset audit ==="
          missing=0
          for f in \
            assets/photo-data-a.js assets/photo-data-b.js assets/photo-data-c.js assets/photo-data-d.js assets/photo-loader.js \
            assets/images/curated/r01.webp assets/images/curated/r16.webp \
            assets/images/curated/s01.webp assets/images/curated/s08.webp \
            assets/images/curated/star-kv.webp assets/images/curated/star01.webp assets/images/curated/star08.webp; do
            if [ ! -f "_site/$f" ]; then
              echo "::warning::Missing deployed asset: $f"
              missing=$((missing+1))
            else
              echo "OK $f"
            fi
          done
          echo "V7.1 audit missing count: $missing"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

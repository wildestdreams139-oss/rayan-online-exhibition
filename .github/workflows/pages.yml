name: Deploy RAYAN exhibition to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare exhibition
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          if [ -f RAYAN_site_payload.zip ]; then
            unzip -q -o RAYAN_site_payload.zip -d _site
          else
            rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
          fi
          if [ -d v6-overlay ]; then
            rsync -a v6-overlay/ _site/
          fi
          # Overlay the latest curated HTML from the repository root\n          cp index.html _site/index.html\n          cp archive.html _site/archive.html\n          touch _site/.nojekyll
          test -f _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
